<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{titre}}</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #F4F1E9; color: #14110F; font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; }
    main { max-width: 620px; margin: 0 auto; padding: clamp(24px, 8vw, 96px) clamp(16px, 4vw, 40px); }
    h1 { font-size: clamp(24px, 4vw, 32px); margin: 0 0 12px; font-weight: 600; }
    p { margin: 0 0 20px; }
    a { color: #C34111; }
  </style>
</head>
<body>
  <main>
    <h1>{{titre}}</h1>
    <p>{{message}}</p>
    <p><a href="{{urlPublique}}/">Retour à la prise de rendez-vous</a></p>
  </main>
</body>
</html>
